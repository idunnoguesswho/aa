<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Meeting in a Pocket</title>
  <!-- Relative paths so it works under /aa/. Content lives in content.js;
       readings.js turns it into the table of contents + reading pane below. -->
  <link rel="stylesheet" href="style.css">
  <script src="content.js" defer></script>
  <script src="readings.js" defer></script>
</head>
<body data-view="home">
  <header class="bar">
    <a class="back" href="./">Home</a>
    <h1>Meeting in a Pocket</h1>
    <a class="signoff-link" href="signoff.html">Sign off</a>
  </header>

  <div class="layout">
    <!-- Contents: on a phone this is the whole screen until a section is
         picked; on a wide screen it's a sidebar that stays put. -->
    <nav id="toc" aria-label="Contents">
      <p class="tagline" id="tagline"></p>
      <div id="tocGroups"><!-- filled by readings.js --></div>
      <p class="hint" id="disclaimer"></p>
    </nav>

    <!-- Reading pane: on a phone this replaces the contents list; on a
         wide screen it sits beside it. -->
    <main id="reading">
      <div class="reading-head">
        <button type="button" id="backBtn" class="back-inline">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
          Contents
        </button>
        <span class="position" id="position"></span>
      </div>
      <article id="article" tabindex="-1"><!-- filled by readings.js --></article>
      <nav class="pager" aria-label="Previous and next section">
        <button type="button" id="prevBtn" class="pager-btn" hidden></button>
        <button type="button" id="nextBtn" class="pager-btn pager-next" hidden></button>
      </nav>
    </main>
  </div>

  <!-- Sign-off, pinned within thumb reach on a phone; hidden on wide
       screens where the header link already covers it. -->
  <div class="mobile-signoff">
    <a class="btn" href="signoff.html">Meeting sign-off</a>
  </div>

  <footer>
    <p><a href="files/Meeting-in-a-Pocket-3x5.docx" download>Download the printable booklet (Word, 3&times;5)</a></p>
  </footer>
</body>
</html>
