# nginx site for aa.ekat.ca - static files only, no backend.
# Install: copy to /etc/nginx/sites-available/aa.ekat.conf, symlink into
# sites-enabled, `nginx -t && systemctl reload nginx`, then run certbot
# (see README) which adds the 443/TLS server block to this file.

server {
    listen 80;
    listen [::]:80;
    server_name aa.ekat.ca;

    # Repo is cloned to /var/www/aa; only ./public is exposed to the web,
    # so .git, README, deploy/ etc. are never reachable.
    root /var/www/aa/public;
    index index.html;

    # Let's Encrypt HTTP-01 challenges (same webroot the other sites use).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        # /about -> about.html or about/index.html, otherwise the 404 page.
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;

    # Basic hardening headers for a static site.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
}
