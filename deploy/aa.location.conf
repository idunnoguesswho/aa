# nginx snippet: serve this repo's ./public at https://ekat.ca/aa/
#
# Installed to /etc/nginx/snippets/aa.location.conf and pulled into ekat.ca's
# existing HTTPS server block with ONE line:   include snippets/aa.location.conf;
# It adds only /aa locations - nothing else on ekat.ca changes.
#
# Deliberately no add_header here: in nginx, any add_header inside a location
# discards ALL headers inherited from the server block, which would silently
# drop ekat.ca's CSP / HSTS / X-Frame-Options for these pages.

# /aa -> /aa/ (explicit https so it doesn't bounce through http behind Cloudflare)
location = /aa {
    return 301 https://$host/aa/;
}

# ^~ = prefix match that wins over any regex locations in ekat.ca's block.
# alias maps /aa/foo -> /var/www/aa/public/foo, so .git, README, deploy/
# in /var/www/aa are never reachable.
location ^~ /aa/ {
    alias /var/www/aa/public/;
    index index.html;
    # /aa/about -> about.html or about/index.html, else 404.
    try_files $uri $uri.html $uri/ =404;
    error_page 404 /aa/404.html;
}
